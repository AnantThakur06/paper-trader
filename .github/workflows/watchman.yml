name: Watchman

on:
  schedule:
    # GitHub cron uses UTC. IST = UTC + 5:30, so market hours 09:15-15:30 IST = 03:45-10:00 UTC.
    # Odd minutes on purpose: GitHub is busiest at :00 and delays those runs more.
    - cron: "47-59/5 3 * * 1-5"    # 09:17 - 09:27 IST
    - cron: "2-59/5 4-9 * * 1-5"   # 09:32 - 15:27 IST
    - cron: "2-42/5 10 * * 1-5"    # 15:32 - 16:12 IST (picks up the last delayed candles)
  workflow_dispatch:               # lets you press "Run workflow" by hand

concurrency:
  group: watchman
  cancel-in-progress: false

jobs:
  check-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-watchman.txt
      - run: pip install -r requirements-watchman.txt
      - run: python watchman.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  keepalive:
    # GitHub switches scheduled workflows off after 60 days without commits.
    # Calling the "enable" API resets that timer, so the watchman never stops.
    if: github.event.schedule == '47-59/5 3 * * 1-5'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watchman.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
